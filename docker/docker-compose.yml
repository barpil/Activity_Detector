services:
  db:
    build:
      context: ../db/
      dockerfile: ../db/db.Dockerfile
    image: activitydetectordb
    container_name: ac_db
    volumes:
      - ac-data-vol:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: activitydetectordb
    ports:
      - "5433:5432"

  backend:
    build:
      context: ../backend/
      dockerfile: backend.Dockerfile
    image: activitydetectorbackend
    container_name: ac_backend
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  ac-data-vol:
